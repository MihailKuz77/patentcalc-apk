name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
    
    - name: Install Python dependencies
      run: pip install buildozer cython pillow qrcode
    
    - name: Pre-accept Android SDK licenses
      run: |
        # Создаём директорию для лицензий заранее
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        
        # Записываем хеши лицензий (актуальные на 2025 год)
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nd975f751698a77b662f1254ddbe6883909e577f8" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        
        echo "Licenses pre-accepted"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/licenses/
    
    - name: Build APK
      run: |
        buildozer init
        
        # Настройка spec
        sed -i 's/^title = .*/title = PatentCalc/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = patentcalc/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = com.patentcalc/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,qrcode,pillow/' buildozer.spec
        sed -i 's/^android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^android.minapi = .*/android.minapi = 26/' buildozer.spec
        sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
        sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
        sed -i 's/# android.arch = armeabi-v7a/android.arch = arm64-v8a/' buildozer.spec
        sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
        sed -i 's/^warn_on_root = .*/warn_on_root = 1/' buildozer.spec
        sed -i 's/^android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
        
        # Показываем spec
        grep -E "^(title|package|requirements|android)" buildozer.spec
        
        # Запуск сборки
        buildozer -v android debug 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        
        echo "=== bin/ ==="
        ls -la bin/ 2>/dev/null || echo "No bin/"
        
        exit $EXIT_CODE
      shell: bash
    
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-results
        path: |
          build.log
          bin/
