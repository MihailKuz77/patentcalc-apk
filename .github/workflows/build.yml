name: Build APK with p4a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip wget \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev \
          libpython3-dev
        
    - name: Install python-for-android
      run: pip install python-for-android cython pillow qrcode kivy==2.3.0
        
    - name: Download Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        echo "NDK_HOME=$PWD/android-ndk-r25b" >> $GITHUB_ENV
        echo "NDK downloaded"
        
    - name: Download Android SDK
      run: |
        mkdir -p android-sdk
        cd android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        cp -r cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        yes | ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$PWD --licenses 2>/dev/null || true
        ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$PWD "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV
        cd ..
        echo "SDK installed"
        
    - name: Build APK
      run: |
        cat > .p4a << 'EOF'
        --name PatentCalc
        --package com.patentcalc.patentcalc
        --version 1.0
        --orientation portrait
        --requirements python3,kivy==2.3.0,qrcode,pillow
        --arch arm64-v8a
        --android-api 33
        --minsdk 26
        --ndk-api 26
        --bootstrap sdl2
        --private .
        --dist-name patentcalc
        --debug
        EOF
        
        python -m pythonforandroid.toolchain apk --config .p4a 2>&1 | tee build.log
        
        echo "=== Looking for APK ==="
        find . -name "*.apk" -type f
        
        mkdir -p bin
        find . -name "*.apk" -type f -exec cp {} bin/ \;
        ls -la bin/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PatentCalc-APK
        path: bin/*.apk
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: build.log
