name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
    
    - name: Install Python dependencies
      run: pip install buildozer cython pillow qrcode
    
    - name: Build APK
      run: |
        set -e
        buildozer init
        
        # Настройка spec
        sed -i 's/^title = .*/title = PatentCalc/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = patentcalc/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = com.patentcalc/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,qrcode,pillow/' buildozer.spec
        sed -i 's/^android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^android.minapi = .*/android.minapi = 26/' buildozer.spec
        sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
        sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
        sed -i 's/# android.arch = armeabi-v7a/android.arch = arm64-v8a/' buildozer.spec
        sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
        sed -i 's/^warn_on_root = .*/warn_on_root = 1/' buildozer.spec
        
        # Запуск сборки
        buildozer -v android debug 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        
        echo "Build exit code: $EXIT_CODE"
        echo "=== bin/ contents ==="
        ls -la bin/ 2>/dev/null || echo "bin/ does not exist"
        echo "=== .buildozer contents ==="
        ls -la .buildozer/ 2>/dev/null || echo ".buildozer/ does not exist"
        
        exit $EXIT_CODE
      shell: bash
    
    - name: Save build log
      if: always()
      run: |
        mkdir -p artifacts
        cp build.log artifacts/ 2>/dev/null || echo "No build.log"
        cp -r bin artifacts/ 2>/dev/null || echo "No bin/"
        cp -r .buildozer artifacts/ 2>/dev/null || echo "No .buildozer/"
    
    - name: Upload all artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-results
        path: artifacts/
