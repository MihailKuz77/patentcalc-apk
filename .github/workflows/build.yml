name: Build APK via Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build APK with Docker
      run: |
        mkdir -p build_apk
        cp main.py build_apk/
        
        cat > build_apk/Dockerfile << 'DOCKEREOF'
        FROM ubuntu:22.04
        
        ENV DEBIAN_FRONTEND=noninteractive
        
        RUN apt-get update && apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3 python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            wget && \
            rm -rf /var/lib/apt/lists/*
        
        RUN pip3 install buildozer cython pillow qrcode
        
        WORKDIR /app
        COPY main.py /app/
        
        RUN yes | buildozer init && \
            sed -i 's/^title = .*/title = PatentCalc/' buildozer.spec && \
            sed -i 's/^package.name = .*/package.name = patentcalc/' buildozer.spec && \
            sed -i 's/^package.domain = .*/package.domain = com.patentcalc/' buildozer.spec && \
            sed -i 's/^requirements = .*/requirements = python3,kivy,qrcode,pillow/' buildozer.spec && \
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec && \
            sed -i 's/^android.minapi = .*/android.minapi = 26/' buildozer.spec && \
            sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec && \
            sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec && \
            sed -i 's/# android.arch = armeabi-v7a/android.arch = arm64-v8a/' buildozer.spec && \
            sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec && \
            sed -i 's/^android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec && \
            sed -i 's/^android.skip_update = .*/android.skip_update = True/' buildozer.spec && \
            sed -i 's/^android.ndk_api = .*/android.ndk_api = 26/' buildozer.spec
        
        CMD ["buildozer", "-v", "android", "debug"]
        DOCKEREOF
        
        echo "=== Building Docker image ==="
        docker build -t patentcalc-builder build_apk/
        
        echo "=== Running container ==="
        docker run -e BUILDOZER_ALLOW_ROOT=1 --name patentcalc-container patentcalc-builder 2>&1 | tee container.log || true
        
        echo "=== Container logs (last 50 lines) ==="
        tail -50 container.log
        
        echo "=== Copying bin/ ==="
        docker cp patentcalc-container:/app/bin/. ./bin/ 2>/dev/null && echo "bin/ copied" || echo "bin/ not found"
        
        echo "=== bin/ contents ==="
        ls -la bin/ 2>/dev/null || echo "No bin/"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PatentCalc-APK
        path: bin/*.apk
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: container.log
